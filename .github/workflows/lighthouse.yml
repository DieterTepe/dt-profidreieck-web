# Misst jeden Montag Ladezeit, Barrierefreiheit und SEO der fuenf Startseiten
# und der vier Testversionen
# (Google Lighthouse, Handy-Ansicht, je Seite 3 Messungen - alle im Artefakt). Ergebnis: Actions -> Lighthouse -> Artefakt
# "lighthouse-berichte" herunterladen und die HTML-Dateien im Browser oeffnen.
name: Lighthouse

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lighthouse ausfuehren
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://dt-profidreieck.de/
            https://dietertepe.github.io/test-dreieck/
            https://dietertepe.github.io/dt-profischraube-web/
            https://dietertepe.github.io/dt-profipassung-web/
            https://dietertepe.github.io/dt-profischweissnaht-web/
            https://dietertepe.github.io/test-dreieck/DT-ProfiDreieck_Test_1-1-0.html
            https://dietertepe.github.io/dt-profischraube-web/DT-ProfiSchraube_Test.html
            https://dietertepe.github.io/dt-profipassung-web/DT-ProfiPassung_Testversion.html
            https://dietertepe.github.io/dt-profischweissnaht-web/DT-ProfiSchweissnaht_Testversion.html
          runs: 3
          uploadArtifacts: true
          artifactName: lighthouse-berichte
          temporaryPublicStorage: false
